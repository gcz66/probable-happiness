server:
  port: 8080

spring:
  application:
    name: xiaoyuan-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xiaoyuan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.xiaoyuan.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# PageHelper 分页插件
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# 自定义配置
jwt:
  # 签名的密钥（生产环境务必更换并妥善保管）
  secret: xiaoyuan-campus-food-secret-key-2026-please-change-me
  # 过期时间（毫秒），默认 7 天
  expire: 604800000
  header: Authorization

logging:
  level:
    com.xiaoyuan: debug
